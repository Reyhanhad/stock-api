name: Stock API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockuser
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: stockdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockuser -d stockdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run basic tests
        run: npm test

      - name: Run integration test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          POSTGRES_USER: stockuser
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: stockdb_test
        run: npm run test:integration

      - name: Build Docker image
        run: docker build -t stock-api:${{ github.sha }} .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/reyhanhad/stock-api"
          docker tag "stock-api:${{ github.sha }}" "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"